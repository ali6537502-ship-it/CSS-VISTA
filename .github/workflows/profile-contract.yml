name: Profile contract check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify profile feature consistency
        run: node scripts/check-profile-contract.mjs
