name: Retry Current Affairs 2026-09-15
on: push
permissions:
  contents: write
jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - run: npm ci
      - name: Rebuild coordinated edition from reviewed publisher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/publish-current-affairs-2026-09-15.yml').read_text()
          a=s.index("          python3 - <<'PY'")+len("          python3 - <<'PY'\n")
          b=s.index("\n          PY",a)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in s[a:b].splitlines())
          exec(compile(code,'publisher','exec'))
          PY
      - name: Validate
        run: |
          node scripts/package-current-affairs.mjs --check
          php tests/current-affairs-validation.php
          node scripts/audit-integrated-academics.mjs
      - name: Commit publication
        run: |
          rm .github/workflows/publish-current-affairs-2026-09-15.yml .github/workflows/retry-current-affairs-2026-09-15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish current affairs 2026-09-15'
          git push origin HEAD:main
