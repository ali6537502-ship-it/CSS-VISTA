name: Validate Complete GK World Correction

on:
  push:
    branches:
      - chat-preview
    paths:
      - 'scripts/finalize-gk-world-correction.mjs'
      - '.github/workflows/gk-world-correction-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production GK World data
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: |
            public/mcq
            src/data/mcq-shards
            src/data/mcqIndex.ts
            src/data/mcqMeta.ts
            scripts/audit-mcq-data.mjs
          sparse-checkout-cone-mode: false

      - name: Checkout correction and audit tools
        uses: actions/checkout@v4
        with:
          ref: chat-preview
          path: tools
          sparse-checkout: |
            scripts/correct-gk-world-repetition.mjs
            scripts/finalize-gk-world-correction.mjs
            scripts/sample-repeated-prefixes.mjs
          sparse-checkout-cone-mode: false

      - name: Apply correction in disposable workspace
        working-directory: site
        run: |
          node ../tools/scripts/finalize-gk-world-correction.mjs --apply
          node ../tools/scripts/correct-gk-world-repetition.mjs --apply

      - name: Validate structural integrity
        working-directory: site
        run: node scripts/audit-mcq-data.mjs

      - name: Run post-correction repetition audit
        working-directory: site
        run: node ../tools/scripts/sample-repeated-prefixes.mjs
