name: Public SEO regression monitoring

on:
  workflow_dispatch:
  schedule:
    # Weekly checks cover the 7-, 14- and 28-day windows after release.
    - cron: '0 12 * * 5'

permissions:
  contents: read

concurrency:
  group: cssv-public-seo-monitoring
  cancel-in-progress: true

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the live release and public crawler surface
        run: python3 scripts/seo/monitor-production.py --expected-sha "$GITHUB_SHA"
      - name: Preserve the dated technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-seo-monitor-${{ github.run_id }}
          path: test-artifacts/seo-monitor.json
          retention-days: 35
          if-no-files-found: warn
