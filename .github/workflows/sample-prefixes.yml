name: Audit GK World Repetition

on:
  push:
    branches:
      - chat-preview
    paths:
      - '.github/workflows/sample-prefixes.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production GK World data
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: |
            public/mcq

      - name: Checkout audit script
        uses: actions/checkout@v4
        with:
          ref: chat-preview
          path: tools
          sparse-checkout: |
            scripts/sample-repeated-prefixes.mjs
          sparse-checkout-cone-mode: false

      - name: Run complete GK World repetition audit
        working-directory: site
        run: node ../tools/scripts/sample-repeated-prefixes.mjs

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: gk-world-repetition-audit
          path: site/audit-output/
          retention-days: 2
