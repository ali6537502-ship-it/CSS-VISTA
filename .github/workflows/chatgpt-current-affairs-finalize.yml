name: Finalize Current Affairs 2026-09-14

on:
  push:
    branches:
      - chatgpt-current-affairs-2026-09-14

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-current-affairs-2026-09-14
          fetch-depth: 0

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Generate verified one-liners and MCQs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/chatgpt-publish-current-affairs-2026-09-14.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          script = script.replace('Daily Current Affairs — 14 September 2026', 'Current Affairs — 14 September 2026')
          script = script.replace('Daily Current Affairs edition date/story count mismatch', 'Current Affairs edition date/story count mismatch')
          Path('/tmp/update_current_affairs.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/update_current_affairs.py

      - name: Validate production Current Affairs edition
        shell: bash
        run: |
          node scripts/package-current-affairs.mjs --check
          php -r 'require "public/api/_current_affairs_model.php"; $d=json_decode(file_get_contents("content/current-affairs/2026/09/2026-09-14.json"),true,64,JSON_THROW_ON_ERROR); ca_validate_dataset($d,false); echo "Current Affairs production edition passed PHP model validation.\n";'

      - name: Validate integrated academic and MCQ data
        run: node scripts/audit-integrated-academics.mjs

      - name: Verify mirrors, counts and today's records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          ca_a=load('src/data/bundled/current-affairs-archive.json')
          ca_b=load('public/one-liner-gk/current-affairs-archive.json')
          pk_a=load('src/data/bundled/pakistan-current-affairs.json')
          pk_b=load('public/one-liner-gk/pakistan-current-affairs.json')
          idx_a=load('src/data/bundled/index.json')
          idx_b=load('public/one-liner-gk/index.json')
          bank=load('public/css-subject-mcqs/current-affairs.json')
          bank_idx=load('public/css-subject-mcqs/index.json')
          edition=load('content/current-affairs/2026/09/2026-09-14.json')

          assert ca_a==ca_b
          assert pk_a==pk_b
          assert idx_a==idx_b
          assert len(edition['stories'])==13 and len({s['id'] for s in edition['stories']})==13
          assert ca_a['count']==len(ca_a['notes'])==363
          assert pk_a['count']==len(pk_a['notes'])==129
          assert sum(1 for n in ca_a['notes'] if str(n.get('id','')).startswith('current-affairs-archive-20260914-'))==13
          assert sum(1 for n in pk_a['notes'] if str(n.get('id','')).startswith('pakistan-current-affairs-20260914-'))==8
          todays=[q for q in bank if str(q.get('id','')).startswith('css-current-affairs-daily-20260914-')]
          assert len(todays)==13
          assert len({q['question'].strip().casefold() for q in todays})==13
          assert all(q.get('topic')=='Current Affairs — 14 September 2026' for q in todays)
          assert all(len(q.get('options',[]))==4 and len({x.strip().casefold() for x in q['options']})==4 for q in todays)
          subject=next(s for s in bank_idx['subjects'] if s['slug']=='current-affairs')
          assert subject['count']==len(bank)==513
          assert bank_idx['total']==42743
          assert idx_a['total']==30512
          print('Verified: 13 stories, 21 one-liner placements, 13 MCQs, indexes and mirrors consistent.')
          PY

      - name: Commit validated publication data
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-publish-current-affairs-2026-09-14.yml
          rm -f .github/workflows/chatgpt-current-affairs-validation-fix.yml
          rm -f .github/workflows/chatgpt-current-affairs-finalize.yml
          git config user.name "CSS Vista automation"
          git config user.email "actions@users.noreply.github.com"
          git add content/current-affairs/2026/09/2026-09-14.json \
                  src/data/bundled/current-affairs-archive.json \
                  public/one-liner-gk/current-affairs-archive.json \
                  src/data/bundled/pakistan-current-affairs.json \
                  public/one-liner-gk/pakistan-current-affairs.json \
                  src/data/bundled/index.json \
                  public/one-liner-gk/index.json \
                  public/css-subject-mcqs/current-affairs.json \
                  public/css-subject-mcqs/index.json \
                  .github/workflows/chatgpt-publish-current-affairs-2026-09-14.yml \
                  .github/workflows/chatgpt-current-affairs-validation-fix.yml \
                  .github/workflows/chatgpt-current-affairs-finalize.yml
          git commit -m "Publish Current Affairs for 14 September 2026"
          git push origin HEAD:chatgpt-current-affairs-2026-09-14
