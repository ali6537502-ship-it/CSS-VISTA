name: Publish 30 October approved Current Affairs PDF
# Source lives outside the catalogue; only dated JSON metadata and PDF enter it.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-oct-30-daily-pdf.yml'
      - 'scripts/daily-pdf/sources/2026-10-30.pages.json'
      - 'scripts/daily-pdf/render-approved-pages.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-oct-30-daily-pdf
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare original approved issue text as a 15-page PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.2.5
          python scripts/daily-pdf/render-approved-pages.py \
            scripts/daily-pdf/sources/2026-10-30.pages.json \
            /tmp/css-vista-daily-2026-10-30.pdf
      - name: Create hashed PDF and matching catalogue metadata
        run: |
          npm ci --no-audit --no-fund
          node scripts/daily-pdf/prepare.mjs /tmp/css-vista-daily-2026-10-30.pdf \
            --date 2026-10-30 \
            --title "CSS VISTA Current Affairs Daily — 30 October 2026 | Issue No. 11"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("content/current-affairs-daily/2026/10/2026-10-30.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          doc["description"] = "Issue No. 11 · Pakistan & the World. Daily current-affairs reading, analysis and revision."
          doc["topics"] = ["Pakistan", "World affairs"]
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate actual PDF and catalogue
        run: |
          npm run validate:daily-pdf
          npm run test:daily-pdf
      - name: Publish approved edition files on main
        run: |
          git config user.name "css-vista-publication"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/current-affairs-daily/2026/10/daily-2026-10-30-v1.pdf \
                  content/current-affairs-daily/2026/10/2026-10-30.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish 30 October 2026 Issue 11 daily PDF and catalogue"
          git push origin HEAD:main
