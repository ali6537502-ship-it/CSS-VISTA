name: Pro membership foundations
on:
  pull_request:
    branches: [main]
    paths: ['public/api/_topics*.php', 'public/api/student/topics.php', 'public/api/admin/topics.php', 'server/sql/022_native_pro_topics.sql', 'server/sql/023_topic_guided_results.sql', 'tests/topics/**', 'src/features/topics/**', 'src/pages/admin/TopicsPanel.tsx', 'src/pages/admin/Admin.tsx', 'src/pages/AccountHome.tsx', 'public/api/_planner*.php', 'public/api/student/planner.php', 'server/sql/020_attempt_planner.sql', 'server/sql/021_connected_reading.sql', 'tests/reading/**', 'src/features/preparation/**', 'src/pages/account/Learning.tsx', 'src/pages/account/Progress.tsx', 'src/pages/account/Tasks.tsx', 'src/components/FpscSyllabusPlanner.tsx', 'tests/planner/**', 'public/api/_tutor*.php', 'public/api/student/tutor.php', 'server/sql/019_scoped_tutor.sql', 'src/features/tutor/**', 'src/pages/account/Tutor.tsx', 'scripts/tutor/**', 'tests/tutor/**', 'public/api/_mentor*.php', 'public/api/student/mentor.php', 'server/sql/018_mentor_records.sql', 'src/features/mentor/**', 'src/pages/account/AnswerPerformance.tsx', 'tests/mentor/**', 'public/api/_precis*.php', 'public/api/student/precis.php', 'public/api/student/precis-feedback.php', 'server/sql/017_precis_evaluations.sql', 'server/sql/016_precis_lab.sql', 'src/features/precis/**', 'src/pages/account/Precis.tsx', 'scripts/precis/**', 'tests/precis/**', 'tests/precis.test.ts', 'public/api/_grammar*.php', 'public/api/student/grammar.php', 'server/sql/015_grammar_progress.sql', 'scripts/grammar/**', 'tests/grammar/**', 'tests/grammarSync.test.ts', 'src/features/grammar/**', 'src/pages/LanguageGrammar.tsx', 'tests/grammarState.test.ts', 'tests/grammarPractice.test.ts', 'public/api/_expression*.php', 'public/api/student/expression.php', 'tests/expression/**', 'src/features/expression/**', 'src/pages/account/Expression.tsx', 'src/pages/GrammarCourse.tsx', 'public/api/_handwriting*.php', 'public/api/student/handwriting*.php', 'server/sql/014_handwriting_workflow.sql', 'server/bin/handwriting-maintenance.php', 'tests/handwriting/**', 'src/features/handwriting/**', 'src/pages/account/Handwriting.tsx', 'public/api/_pro*.php', 'public/api/_learning*.php', 'public/api/_ai*.php', 'public/api/student/learning.php', 'public/api/student/ai-usage.php', 'public/api/admin/ai-usage.php', 'server/sql/013_learning_foundations.sql', 'tests/learning/**', 'public/api/student/membership.php', 'public/api/admin/payments.php', 'server/sql/012_pro_membership.sql', 'tests/pro/**', 'docs/pro/grammar-preservation-map.json', '.github/workflows/pro-foundations.yml']
permissions:
  contents: read
jobs:
  payment-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cssvista_briefing_test
          MYSQL_ROOT_PASSWORD: cssvista_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcssvista_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      CI: 'true'
      CSSV_DB_HOST: 127.0.0.1
      CSSV_DB_NAME: cssvista_briefing_test
      CSSV_DB_USER: root
      CSSV_DB_PASSWORD: cssvista_ci_only
      CSSV_SITE_ORIGIN: http://localhost:4173
      CSSV_APP_SECRET: isolated-pro-ci-only-not-production-123456789012345678901234567890
      CSSV_PRIVATE_STORAGE_DIR: /tmp/cssv-pro-private
      CSSV_CONFIG_FILE: /tmp/cssv-pro-private/config.php
      PHP_CLI_SERVER_WORKERS: '8'
      CSSV_TEST_HANDWRITING_TRANSPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, exif, curl, fileinfo
      - name: Install pinned Node dependencies
        run: npm run install:ci
      - name: Check syntax and pure membership rules
        run: |
          for file in public/api/_topics*.php public/api/student/topics.php public/api/admin/topics.php tests/topics/*.php public/api/_planner*.php public/api/student/planner.php tests/planner/*.php tests/reading/*.php public/api/_tutor*.php public/api/student/tutor.php tests/tutor/*.php public/api/_mentor*.php public/api/student/mentor.php tests/mentor/*.php public/api/_precis*.php public/api/student/precis.php public/api/student/precis-feedback.php tests/precis/*.php public/api/_grammar*.php public/api/student/grammar.php tests/grammar/*.php public/api/_pro*.php public/api/_learning*.php public/api/_ai*.php public/api/_handwriting*.php public/api/_expression*.php public/api/student/expression.php tests/expression/*.php public/api/student/handwriting*.php public/api/student/membership.php public/api/admin/payments.php public/api/student/learning.php public/api/student/ai-usage.php public/api/admin/ai-usage.php tests/pro/*.php tests/learning/*.php tests/handwriting/*.php server/bin/handwriting-maintenance.php server/bin/ai-operation-sweep.php; do php -l "$file"; done
          php tests/topics/unit.php
          php tests/reading/unit.php
          php tests/planner/unit.php
          php tests/tutor/unit.php
          node scripts/tutor/export-grammar.mjs --check
          php tests/mentor/unit.php
          php tests/pro/unit.php
          php tests/learning/unit.php
          php tests/handwriting/unit.php
          php tests/expression/unit.php
          php tests/grammar/unit.php
          php tests/precis/unit.php
          php tests/precis/feedback-unit.php
          node scripts/grammar/export-catalog.mjs --check
          node tests/pro/grammar-preservation.mjs
          node --test tests/grammarState.test.ts tests/grammarPractice.test.ts tests/grammarSync.test.ts tests/precis.test.ts
      - name: Create isolated database and HTTP runtime
        run: |
          mkdir -p /tmp/cssv-pro-private test-artifacts
          php tests/current-affairs/setup.php
          php -d opcache.enable=0 -S localhost:4173 -t public tests/pro/router.php > test-artifacts/pro-php.log 2>&1 &
          node -e "const retry=async()=>{for(let n=0;n<30;n++){try{await fetch('http://localhost:4173/api/auth/session.php');return}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)};retry()"
      - name: Verify payments, learning, handwriting and expression lifecycle
        run: |
          node tests/topics/security.mjs
          node tests/reading/security.mjs
          node tests/planner/security.mjs
          node tests/tutor/security.mjs
          node tests/pro/security.mjs
          node tests/mentor/security.mjs
          node tests/learning/security.mjs
          node tests/handwriting/security.mjs
          node tests/expression/security.mjs
          node tests/grammar/security.mjs
          node tests/precis/security.mjs
          node tests/precis/feedback-security.mjs
      - name: Service diagnostics on failure
        if: failure()
        run: tail -n 80 test-artifacts/pro-php.log
