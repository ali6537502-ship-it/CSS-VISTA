name: Hostinger build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hostinger-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://www.css-vista.com
  CSSV_STRICT_CONTENT_VALIDATION: 'false'

jobs:
  clean-lockfile-parity:
    name: Hostinger parity — npm ci + npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Verify AdSense route and policy safeguards
        run: npm run test:ads

      - name: Build with default Hostinger command
        run: npm run build

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Verify exact deployment fingerprint artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/deployment-fingerprint.json
          jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' dist/deployment-fingerprint.json >/dev/null

      - name: Verify Book Summaries build artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/book-summaries/index.json
          jq -e '.total > 0 and (.books | length) == .total' dist/book-summaries/index.json >/dev/null
          jq -e '.books[] | select(.slug == "why-nations-fail" and .title == "Why Nations Fail")' dist/book-summaries/index.json >/dev/null
          test -s dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'Why Nations Fail Summary' dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'The authors argue that the main difference lies in institutions' dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'RewriteRule ^book-summaries/' dist/.htaccess

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  documented-hostinger-parity:
    name: Hostinger parity — npm install + build:hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install using documented Hostinger command
        run: npm install --no-audit --no-fund

      - name: Report harmless lock metadata normalization
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::warning::npm install normalized lockfile peer metadata. This is non-functional metadata churn and must not block deployment."
            git diff --stat -- package.json package-lock.json
          fi

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Build Hostinger production artifact
        run: npm run build:hostinger

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Verify exact deployment fingerprint artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/deployment-fingerprint.json
          jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' dist/deployment-fingerprint.json >/dev/null

      - name: Verify Book Summaries build artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/book-summaries/index.json
          jq -e '.total > 0 and (.books | length) == .total' dist/book-summaries/index.json >/dev/null
          jq -e '.books[] | select(.slug == "why-nations-fail" and .title == "Why Nations Fail")' dist/book-summaries/index.json >/dev/null
          test -s dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'Why Nations Fail Summary' dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'The authors argue that the main difference lies in institutions' dist/seo/book-summaries/why-nations-fail.html
          grep -Fq 'RewriteRule ^book-summaries/' dist/.htaccess

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Strict editorial/content audit
        continue-on-error: true
        env:
          CSSV_STRICT_CONTENT_VALIDATION: 'true'
        run: npm run build:hostinger:strict

  live-deployment-fingerprint:
    name: Live exact deployment fingerprint
    if: github.event_name == 'push'
    needs:
      - clean-lockfile-parity
      - documented-hostinger-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Hostinger to expose this exact Git SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Exact deployment fingerprint probe ${attempt}: expecting ${GITHUB_SHA}"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "${SITE_ORIGIN}/deployment-fingerprint.json?expected=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)")" || code=000
            if [ "$code" = "200" ]; then
              live_sha="$(jq -r '.gitSha // empty' "$body" 2>/dev/null || true)"
              echo "Live fingerprint SHA: ${live_sha:-missing}"
              if jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' "$body" >/dev/null 2>&1; then
                echo "::notice::Hostinger live fingerprint matches exact pushed SHA ${GITHUB_SHA}."
                rm -f "$body"
                exit 0
              fi
            else
              echo "Fingerprint endpoint HTTP ${code}."
            fi
            rm -f "$body"
            if [ "$attempt" -lt 30 ]; then sleep 15; fi
          done
          echo "::error::Hostinger never exposed deployment fingerprint for exact SHA ${GITHUB_SHA}. A 200 response from other routes is not accepted as proof of deployment."
          exit 1

  live-backend-readiness:
    name: Live Hostinger backend readiness
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe production backend without exposing secrets
        shell: bash
        run: |
          set +e
          health_url="${SITE_ORIGIN}/api/health.php"
          for attempt in $(seq 1 12); do
            body_file="$(mktemp)"
            http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$body_file" -w '%{http_code}' "$health_url")"
            echo "Health probe attempt ${attempt}: HTTP ${http_code}"
            if jq -e '.service == "css-vista-hostinger-backend"' "$body_file" >/dev/null 2>&1; then
              jq '{ok, runtime, configured, database}' "$body_file"
              if jq -e '.database.reachable == true and .database.schema_ready == true' "$body_file" >/dev/null 2>&1; then
                echo "::notice::Hostinger backend database is reachable and the core schema is ready."
              else
                echo "::warning::Hostinger backend is deployed, but the production database/configuration is not ready for migration yet."
              fi
              rm -f "$body_file"
              exit 0
            fi
            cat "$body_file" || true
            rm -f "$body_file"
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          echo "::warning::The live Hostinger backend health endpoint could not be verified after retries."
          exit 0

  live-book-summaries-readiness:
    name: Live Book Summaries readiness
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current Book Summaries library and full stable reader
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          jq -S . public/book-summaries/index.json > "$expected"
          expected_hash="$(sha256sum "$expected" | awk '{print $1}')"

          for attempt in $(seq 1 20); do
            echo "Book Summaries production probe attempt ${attempt}"
            library="$(mktemp)"
            page="$(mktemp)"
            library_code="$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o "$library" -w '%{http_code}' "${SITE_ORIGIN}/book-summaries/index.json?build=${GITHUB_SHA}&ts=$(date +%s)")" || library_code=000
            if [ "$library_code" = "200" ] && jq -e '.total > 0 and (.books | length) == .total' "$library" >/dev/null 2>&1; then
              normalized="$(mktemp)"
              jq -S . "$library" > "$normalized"
              live_hash="$(sha256sum "$normalized" | awk '{print $1}')"
              rm -f "$normalized"
              if [ "$live_hash" = "$expected_hash" ]; then
                page_code="$(curl -sS --connect-timeout 10 --max-time 20 -L -H 'Cache-Control: no-cache' -o "$page" -w '%{http_code}' "${SITE_ORIGIN}/book-summaries/why-nations-fail?build=${GITHUB_SHA}&ts=$(date +%s)")" || page_code=000
                if [ "$page_code" = "200" ] && grep -Fq 'Why Nations Fail Summary' "$page" && grep -Fq 'The authors argue that the main difference lies in institutions' "$page"; then
                  echo "::notice::Why Nations Fail stable reader is live with the correct full-summary content."
                  rm -f "$library" "$page" "$expected"
                  exit 0
                fi
                echo "Why Nations Fail reader: HTTP ${page_code}; full expected summary not yet visible."
              else
                echo "Book Summaries index is live but does not match this repository revision."
              fi
            else
              echo "Book Summaries index: HTTP ${library_code} or invalid JSON."
            fi
            rm -f "$library" "$page"
            if [ "$attempt" -lt 20 ]; then sleep 15; fi
          done
          rm -f "$expected"
          echo "::error::Hostinger did not expose the current Book Summaries library and full Why Nations Fail reader within the verification window."
          exit 1

  live-adsense-readiness:
    name: Live AdSense and crawler readiness
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Hostinger and verify the deployed crawler surface
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            echo "AdSense production probe attempt ${attempt}"
            if node scripts/check-adsense-production.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 15; fi
          done
          echo "::error::Hostinger did not expose the expected AdSense and crawler files within the verification window."
          exit 1
