name: Hostinger build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hostinger-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://www.css-vista.com
  CSSV_STRICT_CONTENT_VALIDATION: 'false'

jobs:
  clean-lockfile-parity:
    name: Hostinger parity — npm ci + npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Build with default Hostinger command
        run: npm run build

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  documented-hostinger-parity:
    name: Hostinger parity — npm install + build:hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install using documented Hostinger command
        run: npm install --no-audit --no-fund

      - name: Report harmless lock metadata normalization
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::warning::npm install normalized lockfile peer metadata. This is non-functional metadata churn and must not block deployment."
            git diff --stat -- package.json package-lock.json
          fi

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Build Hostinger production artifact
        run: npm run build:hostinger

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Strict editorial/content audit
        continue-on-error: true
        env:
          CSSV_STRICT_CONTENT_VALIDATION: 'true'
        run: npm run build:hostinger:strict
