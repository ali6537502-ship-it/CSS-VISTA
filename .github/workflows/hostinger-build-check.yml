name: Hostinger build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hostinger-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_ORIGIN: https://www.css-vista.com
  CSSV_STRICT_CONTENT_VALIDATION: 'true'

jobs:
  clean-lockfile-parity:
    name: Hostinger parity — npm ci + npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Verify AdSense route and policy safeguards
        run: npm run test:ads

      - name: Verify CSS eligibility rule engine
        run: npm run test:css-eligibility

      - name: Type-check application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Run complete project test suite
        run: npm run test:all

      - name: Build with default Hostinger command
        run: npm run build

      - name: Verify production direct-route refreshes
        run: npm run test:routes && node --test tests/pausedSubjectSeo.test.mjs

      - name: Install isolated browser verification tools
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          npm exec --prefix tests/browser -- playwright-core install --with-deps chromium

      - name: Verify responsive daily PDF library and worker reader
        shell: bash
        run: |
          npm run dev -- --port 5173 > /tmp/daily-pdf-vite.log 2>&1 &
          node -e "const run=async()=>{for(let n=0;n<40;n++){try{await fetch('http://localhost:5173');return}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)};run()"
          browser_path=$(node --input-type=module -e "import { chromium } from './tests/browser/node_modules/playwright-core/index.mjs'; process.stdout.write(chromium.executablePath())")
          CSSV_BROWSER_EXECUTABLE="$browser_path" node tests/browser/daily-pdf.mjs
          CSSV_BROWSER_EXECUTABLE="$browser_path" node tests/browser/daily-pdf-publications.mjs
          CSSV_BROWSER_EXECUTABLE="$browser_path" node tests/browser/daily-pdf-production.mjs

      - name: Verify public rendering, tools and advertising state in Chromium
        shell: bash
        run: |
          browser_path=$(node --input-type=module -e "import { chromium } from './tests/browser/node_modules/playwright-core/index.mjs'; process.stdout.write(chromium.executablePath())")
          CSSV_BROWSER_EXECUTABLE="$browser_path" npm run audit:browser:seo

      - name: Verify answer-writing timer recovery and controls in Chromium
        shell: bash
        run: |
          browser_path=$(node --input-type=module -e "import { chromium } from './tests/browser/node_modules/playwright-core/index.mjs'; process.stdout.write(chromium.executablePath())")
          CSSV_BROWSER_EXECUTABLE="$browser_path" node tests/browser/answer-timer.mjs

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Verify exact deployment fingerprint artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/deployment-fingerprint.json
          jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' dist/deployment-fingerprint.json >/dev/null

      - name: Verify owner-requested Book Summaries removal
        run: node scripts/audit-book-removal.mjs

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  documented-hostinger-parity:
    name: Hostinger parity — npm install + build:hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install using documented Hostinger command
        run: npm install --no-audit --no-fund

      - name: Report harmless lock metadata normalization
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::warning::npm install normalized lockfile peer metadata. This is non-functional metadata churn and must not block deployment."
            git diff --stat -- package.json package-lock.json
          fi

      - name: Verify critical runtime dependency
        run: |
          node -e "console.log(require.resolve('react-router/package.json'))"
          test -f node_modules/react-router/dist/development/index.d.ts

      - name: Build Hostinger production artifact
        run: npm run build:hostinger

      - name: Verify generated Hostinger artifact
        run: npm run audit:hostinger

      - name: Verify exact deployment fingerprint artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/deployment-fingerprint.json
          jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' dist/deployment-fingerprint.json >/dev/null

      - name: Verify owner-requested Book Summaries removal
        run: node scripts/audit-book-removal.mjs

      - name: Lint Hostinger PHP backend
        run: |
          test -f dist/api/health.php
          find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Strict editorial/content audit
        env:
          CSSV_STRICT_CONTENT_VALIDATION: 'true'
        run: npm run build:hostinger:strict

  live-deployment-fingerprint:
    name: Live exact deployment fingerprint
    if: github.event_name == 'push'
    needs:
      - clean-lockfile-parity
      - documented-hostinger-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Hostinger to expose this exact Git SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Exact deployment fingerprint probe ${attempt}: expecting ${GITHUB_SHA}"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "${SITE_ORIGIN}/deployment-fingerprint.json?expected=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)")" || code=000
            if [ "$code" = "200" ]; then
              live_sha="$(jq -r '.gitSha // empty' "$body" 2>/dev/null || true)"
              echo "Live fingerprint SHA: ${live_sha:-missing}"
              if jq -e --arg sha "$GITHUB_SHA" '.schemaVersion == 1 and .gitSha == $sha and .source == "git-rev-parse-head" and .buildTarget == "hostinger"' "$body" >/dev/null 2>&1; then
                echo "::notice::Hostinger live fingerprint matches exact pushed SHA ${GITHUB_SHA}."
                rm -f "$body"
                exit 0
              fi
            else
              echo "Fingerprint endpoint HTTP ${code}."
            fi
            rm -f "$body"
            if [ "$attempt" -lt 30 ]; then sleep 15; fi
          done
          echo "::error::Hostinger never exposed deployment fingerprint for exact SHA ${GITHUB_SHA}. A 200 response from other routes is not accepted as proof of deployment."
          exit 1

  live-backend-readiness:
    name: Live Hostinger backend readiness
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe production backend without exposing secrets
        shell: bash
        run: |
          set +e
          health_url="${SITE_ORIGIN}/api/health.php"
          for attempt in $(seq 1 12); do
            body_file="$(mktemp)"
            http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$body_file" -w '%{http_code}' "$health_url")"
            echo "Health probe attempt ${attempt}: HTTP ${http_code}"
            if [ "$http_code" = "200" ] && jq -e '.ok == true' "$body_file" >/dev/null 2>&1; then
              jq '{ok}' "$body_file"
              echo "::notice::Hostinger PHP runtime is responding. Private database/configuration diagnostics require the MFA admin endpoint."
              rm -f "$body_file"
              exit 0
            fi
            cat "$body_file" || true
            rm -f "$body_file"
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done
          echo "::warning::The live Hostinger backend health endpoint could not be verified after retries."
          exit 0

  live-book-removal-readiness:
    name: Live Book Summaries removal
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retired URLs and public assets return Gone
        run: node scripts/check-book-removal-production.mjs

  live-adsense-readiness:
    name: Live AdSense and crawler readiness
    if: github.event_name == 'push'
    needs:
      - live-deployment-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Hostinger and verify the deployed crawler surface
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            echo "AdSense production probe attempt ${attempt}"
            if node scripts/check-adsense-production.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 15; fi
          done
          echo "::error::Hostinger did not expose the expected AdSense and crawler files within the verification window."
          exit 1
