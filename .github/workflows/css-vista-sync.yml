name: Apply CSS Vista production update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: css-vista-production-sync
  cancel-in-progress: false

jobs:
  apply-update:
    if: github.event.head_commit.message == 'Prepare CSS Vista production sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified public assets
        shell: bash
        run: |
          set -euo pipefail
          cat .github/css-vista-sync/chunk-* > /tmp/css-vista-public-assets.tar.gz
          echo "28ec132c075ab3782c16ad0e692de7ef51cf01fa046b940dbb6ca17807c95a2e  /tmp/css-vista-public-assets.tar.gz" | sha256sum -c -
          tar -xzf /tmp/css-vista-public-assets.tar.gz

      - name: Apply verified source changes
        shell: bash
        run: |
          set -euo pipefail
          echo "6cc8f5e363c951b2b8c3d77649a8754322e7632c1dc9a1bc6b6a86b86428e763  .github/css-vista-source.patch" | sha256sum -c -
          git apply --index .github/css-vista-source.patch
          git add -- public/css-subject-mcqs public/images/mentor-ali.jpg public/images/mentor-sadia.jpg public/magazines public/note-previews public/recent-affairs

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish integrated update
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- .github/css-vista-source.patch .github/css-vista-sync .github/workflows/css-vista-sync.yml
          git diff --cached --check
          git config user.name "CSS Vista Automation"
          git config user.email "ali6537502@gmail.com"
          git commit -m "Rebuild CSS Vista academic preparation experience"
          git push origin HEAD:main
