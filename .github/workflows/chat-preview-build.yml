name: CSS Vista Chat Preview Build

on:
  push:
    branches:
      - chat-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runnable frontend
        run: npx vite build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: css-vista-chat-preview
          path: dist
          if-no-files-found: error
          retention-days: 1
