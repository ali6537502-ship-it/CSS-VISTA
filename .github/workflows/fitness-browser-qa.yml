name: Fitness Coach unit and account-sync regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/FitnessCoach.tsx'
      - 'src/features/fitness/**'
      - 'src/lib/accountSync.ts'
      - 'tests/fitness*.ts'
      - '.github/workflows/fitness-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/FitnessCoach.tsx'
      - 'src/features/fitness/**'
      - 'src/lib/accountSync.ts'
      - 'tests/fitness*.ts'
      - '.github/workflows/fitness-browser-qa.yml'

jobs:
  fitness-unit-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify complete fitness and account sync regression suite
        run: npm run test:workspace
