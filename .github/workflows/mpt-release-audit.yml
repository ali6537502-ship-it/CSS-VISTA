name: MPT release audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mpt-release:
    name: Forty-paper MPT release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify legacy exclusion manifest
        run: node scripts/build-mpt-legacy-exclusions.mjs --check

      - name: Audit all 40 MPT papers
        id: audit
        shell: bash
        run: |
          set +e
          node scripts/audit-mpt-40-papers.mjs 2>&1 | tee mpt-release-audit.json
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-release-audit-${{ github.sha }}
          path: mpt-release-audit.json
          if-no-files-found: error
