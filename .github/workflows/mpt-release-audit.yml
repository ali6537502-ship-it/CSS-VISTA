name: MPT release audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mpt-release:
    name: Forty-paper MPT release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify legacy exclusion manifest
        run: node scripts/build-mpt-legacy-exclusions.mjs --check

      - name: Audit all 40 MPT papers
        shell: bash
        run: |
          set +e
          node scripts/audit-mpt-40-papers.mjs 2>&1 | tee mpt-release-audit.json
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Audit factual integrity and current-affairs provenance
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/audit-mpt-factual-integrity.mjs 2>&1 | tee mpt-factual-audit.json
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Retain MPT audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-release-audit-${{ github.sha }}
          path: |
            mpt-release-audit.json
            mpt-factual-audit.json
          if-no-files-found: error
          retention-days: 90
