name: MPT release audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mpt-release:
    name: Forty-paper MPT editorial release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate the reviewed MPT bank
        run: node scripts/mpt/validate-bank.mjs | tee mpt-bank-validation.txt

      - name: Source gate (series rebuilds exactly and every paper passes)
        run: node scripts/mpt/audit-release.mjs

      - name: Export and prove the exported papers equal the audited papers
        run: |
          node scripts/export-mpt-papers.mjs --out dist/api/_mpt_papers
          node scripts/mpt/audit-release.mjs --exported dist/api/_mpt_papers

      - name: Release tests
        run: node --test tests/mptRelease.test.mjs

      - name: Retain MPT audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-release-audit-${{ github.sha }}
          path: |
            mpt-bank-validation.txt
            data-archive/mpt-release-reports/release-report.md
            data-archive/mpt-release-reports/release-report.json
          if-no-files-found: warn
          retention-days: 90
