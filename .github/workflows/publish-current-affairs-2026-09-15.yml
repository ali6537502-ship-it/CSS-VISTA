name: Publish Current Affairs 2026-09-15
on: push
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Build coordinated edition
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, datetime
          root=pathlib.Path('.')
          stories=[
          {"id":"pk-canada-fipa-2026-09-15","category":"Pakistan Foreign Relations","headline":"Pakistan and Canada agree to accelerate investment-protection pact negotiations","summary":"Pakistan and Canada agreed on 15 September to accelerate negotiations on a Foreign Investment Promotion and Protection Agreement (FIPA), with the next round expected in the first week of October.","what_happened":"Commerce Minister Jam Kamal Khan and Canadian High Commissioner Tarik Ali Khan discussed faster FIPA negotiations and wider cooperation in agriculture, mining, clean energy, aviation and value-added industries.","why_it_matters":"A concluded investment-protection framework can improve legal predictability for cross-border investment and support Pakistan's effort to attract longer-term foreign capital.","pakistan_perspective":"The talks fit Pakistan's wider export- and investment-led growth agenda and could diversify commercial links beyond traditional partners.","key_takeaways":["The next FIPA negotiation round is expected in the first week of October 2026.","Priority sectors include agriculture, mining, clean energy, aviation and value-added industries."],"facts":[{"label":"Agreement under negotiation","value":"Foreign Investment Promotion and Protection Agreement (FIPA)"},{"label":"Next negotiation round","value":"First week of October 2026"}],"what_to_watch":["Whether the October round resolves outstanding issues and moves the agreement toward conclusion."],"question_angles":["How can bilateral investment treaties support Pakistan's investment-led growth strategy?"],"topics":["Pakistan-Canada relations","Foreign investment","Trade diplomacy"],"countries":["Pakistan","Canada"],"institutions":["Ministry of Commerce"],"organisations":[],"reports":[],"treaties":["Foreign Investment Promotion and Protection Agreement"],"people":["Jam Kamal Khan","Tarik Ali Khan"],"sources":[{"publisher":"Press Information Department","title":"Pakistan, Canada Agree to Accelerate Investment Pact and Expand Trade Cooperation","url":"https://pid.gov.pk/site/press_detail/33930","published_at":"2026-09-15","source_type":"Official Source"}]},
          {"id":"global-lng-demand-rebound-2026-09-15","category":"Global Economy & Energy","headline":"Asian LNG demand expected to rebound after Middle East war ends","summary":"LNG demand in China, India and Pakistan is expected to recover from multi-year lows once the Middle East war ends, after high prices and supply disruption suppressed purchases.","what_happened":"Reuters reported on 15 September that LNG demand from China, India and Pakistan is likely to rebound when the conflict ends and energy-market conditions normalise.","why_it_matters":"The outlook connects geopolitical conflict, shipping security and Asian energy demand, with direct implications for import-dependent Pakistan.","pakistan_perspective":"Pakistan's LNG demand is highly sensitive to international prices and foreign-exchange constraints, making any post-conflict normalisation important for power generation and the external account.","key_takeaways":["Pakistan is among the Asian markets where LNG demand is expected to rebound after the Middle East war ends.","Energy conflict has depressed demand through higher prices and disrupted supply."],"facts":[{"label":"Countries highlighted","value":"China, India and Pakistan"}],"what_to_watch":["LNG spot prices, shipping through Gulf routes and Pakistan's procurement volumes."],"question_angles":["Assess how Middle East energy shocks transmit to Pakistan's balance of payments and energy security."],"topics":["LNG","Energy security","Middle East conflict"],"countries":["Pakistan","China","India"],"institutions":[],"organisations":[],"reports":[],"treaties":[],"people":[],"sources":[{"publisher":"Reuters","title":"LNG demand in China, India and Pakistan expected to rebound after US-Iran war ends","url":"https://www.reuters.com/business/energy/lng-demand-china-india-expected-recover-when-mideast-war-ends-2026-09-15/","published_at":"2026-09-15","source_type":"News Report"}]},
          {"id":"yemen-displacement-2026-09-15","category":"Conflict & Humanitarian Affairs","headline":"Renewed Yemen conflict displaces more than 100,000 people","summary":"Renewed fighting in Yemen has displaced more than 100,000 people internally, deepening one of the world's most severe humanitarian crises.","what_happened":"Reuters reported, citing UNHCR, that more than 100,000 people have been displaced as fighting intensified, while insecurity and damaged infrastructure constrained humanitarian access.","background":"The UN had already warned in early September that renewed large-scale fighting risked major political, economic and security consequences for Yemen and the wider region.","why_it_matters":"Escalation around Yemen threatens civilians, Red Sea security and energy and trade routes near the Bab el-Mandeb Strait.","regional_implications":"Further escalation could widen Gulf security tensions and affect shipping through one of the world's most important maritime chokepoints.","key_takeaways":["More than 100,000 people have been displaced by the renewed Yemen conflict.","The escalation has implications beyond Yemen because of proximity to the Bab el-Mandeb Strait."],"facts":[{"label":"New displacement","value":"More than 100,000 people"}],"what_to_watch":["Humanitarian access, Houthi advances, Saudi responses and Red Sea shipping security."],"question_angles":["Explain the geopolitical significance of Yemen and Bab el-Mandeb for global trade and Gulf security."],"topics":["Yemen conflict","Humanitarian crisis","Bab el-Mandeb"],"countries":["Yemen","Saudi Arabia"],"institutions":["United Nations High Commissioner for Refugees"],"organisations":["UNHCR"],"reports":[],"treaties":[],"people":[],"sources":[{"publisher":"Reuters","title":"Yemen conflict displaces over 100,000 people, UN says","url":"https://www.reuters.com/world/middle-east/yemen-conflict-displaces-over-100000-people-un-says-2026-09-15/","published_at":"2026-09-15","source_type":"News Report"}]},
          {"id":"russia-ukraine-energy-strikes-2026-09-15","category":"Global Security","headline":"Russia and Ukraine continue energy strikes despite announced halt effort","summary":"Russia and Ukraine continued attacks on energy-related infrastructure despite a US effort to halt such strikes, keeping pressure on regional security and global fuel markets.","what_happened":"Reuters reported that Russia launched around 200 drones overnight, while Ukraine struck a Russian oil refinery and other facilities.","why_it_matters":"Energy infrastructure has become a strategic target in the war, linking battlefield escalation with fuel supply, prices and European security.","global_implications":"Continued refinery and energy-system attacks can tighten fuel markets and complicate diplomatic efforts to reduce the economic spillovers of the war.","key_takeaways":["Energy infrastructure remains a central target in the Russia-Ukraine war.","The continued strikes undercut efforts to establish a limited energy ceasefire."],"facts":[{"label":"Russian overnight drone launch reported","value":"Around 200 drones"}],"what_to_watch":["Whether a verifiable energy-strike halt can be negotiated and how refinery outages affect fuel markets."],"question_angles":["How has energy infrastructure become an instrument of coercion in contemporary warfare?"],"topics":["Russia-Ukraine war","Energy security","Drone warfare"],"countries":["Russia","Ukraine"],"institutions":[],"organisations":[],"reports":[],"treaties":[],"people":[],"sources":[{"publisher":"Reuters","title":"Russia and Ukraine press on with energy strikes despite Trump","url":"https://www.reuters.com/world/europe/russia-hits-petrol-station-warehouse-facilities-kyiv-mayor-says-2026-09-15/","published_at":"2026-09-15","source_type":"News Report"}]},
          {"id":"wto-trade-system-reform-2026-09-15","category":"International Economy","headline":"WTO warns global trade system is at a critical juncture and urges reform","summary":"The World Trade Organization warned that the multilateral trading system faces a critical reform moment as geopolitical fragmentation, state intervention and digital trade strain existing rules.","what_happened":"Reuters reported that the WTO's annual report warned of severe long-term costs if the world fractures into competing trade blocs and called for renewed multilateral cooperation.","why_it_matters":"Trade fragmentation can reduce efficiency, weaken export opportunities and disproportionately hurt developing economies that rely on predictable multilateral rules.","pakistan_perspective":"As an export-seeking developing economy, Pakistan has an interest in a functioning rules-based trading system, lower fragmentation and broader market access.","global_implications":"The WTO analysis frames trade reform as a growth and development issue, not only an institutional one.","key_takeaways":["The WTO says the global trading system is at a critical juncture.","Its annual report warns that fragmentation into rival blocs could impose major long-term output and trade losses."],"facts":[{"label":"WTO membership","value":"166 members"}],"what_to_watch":["Progress on WTO reform, dispute settlement and rules for digital trade and industrial policy."],"question_angles":["Why is multilateral trade reform important for developing economies such as Pakistan?"],"topics":["WTO reform","Trade fragmentation","Multilateralism"],"countries":[],"institutions":["World Trade Organization"],"organisations":["World Trade Organization"],"reports":["WTO annual report"],"treaties":[],"people":[],"sources":[{"publisher":"Reuters","title":"WTO says global trade system at critical juncture, urges reform","url":"https://www.reuters.com/world/africa/wto-says-global-trade-system-critical-juncture-urges-reform-2026-09-15/","published_at":"2026-09-15","source_type":"News Report"}]},
          {"id":"gaza-remains-war-crimes-concern-2026-09-15","category":"International Law & Human Rights","headline":"UN rights chief says remains uncovered in Gaza raise war-crimes concerns","summary":"UN human rights chief Volker Türk said the recovery of hundreds of bodies from destroyed buildings in Gaza raises concerns about possible war crimes and called for investigative access and preservation of evidence.","what_happened":"Reuters reported that more than 630 bodies had been recovered from rubble and that the UN rights chief urged access for international investigators.","why_it_matters":"The issue concerns international humanitarian law, accountability, evidence preservation and the legal scrutiny of conduct during armed conflict.","global_implications":"The recovery and identification process may affect ongoing international legal and accountability efforts related to the Gaza conflict.","key_takeaways":["The UN rights chief raised possible war-crimes concerns over remains recovered from Gaza rubble.","International investigative access and evidence preservation are central to accountability."],"facts":[{"label":"Bodies reported recovered","value":"More than 630"},{"label":"UN human rights chief","value":"Volker Türk"}],"what_to_watch":["Access for investigators, identification of remains and developments in international legal proceedings."],"question_angles":["Discuss the role of evidence preservation and international investigations in enforcing humanitarian law."],"topics":["Gaza","International humanitarian law","War crimes","Human rights"],"countries":["Palestine","Israel"],"institutions":["Office of the UN High Commissioner for Human Rights"],"organisations":["United Nations"],"reports":[],"treaties":[],"people":["Volker Türk"],"sources":[{"publisher":"Reuters","title":"UN rights chief says uncovered remains in Gaza raise concerns of war crimes","url":"https://www.reuters.com/world/middle-east/un-rights-chief-says-uncovered-remains-gaza-raise-concerns-war-crimes-2026-09-15/","published_at":"2026-09-15","source_type":"News Report"}]}
          ]
          edition={"schema_version":1,"date":"2026-09-15","published_at":"2026-09-15T19:55:00+05:00","edition":"Current Affairs — 15 September 2026","stories":stories}
          p=root/'content/current-affairs/2026/09/2026-09-15.json'; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(edition,ensure_ascii=False,indent=2)+'\n')
          general=[
          'Pakistan and Canada agreed on 15 September 2026 to accelerate negotiations on a Foreign Investment Promotion and Protection Agreement (FIPA); the next round is expected in the first week of October.',
          'Reuters reported on 15 September 2026 that LNG demand in China, India and Pakistan is expected to rebound after the Middle East war ends.',
          'Renewed fighting in Yemen has displaced more than 100,000 people, according to UNHCR reporting cited by Reuters on 15 September 2026.',
          'Russia launched around 200 drones overnight as Russia and Ukraine continued energy-related strikes on 15 September 2026.',
          'The WTO warned on 15 September 2026 that the global trading system is at a critical juncture and requires reform.',
          'UN human rights chief Volker Türk said the recovery of more than 630 bodies from Gaza rubble raised concerns about possible war crimes.'
          ]
          pk=[general[0],general[1]]
          def add_notes(path,texts,prefix,subcat):
            d=json.loads(path.read_text()); existing={n.get('text') for n in d['notes']}; mx=max([int(n['id'].split('-')[-1]) for n in d['notes'] if n.get('id','').split('-')[-1].isdigit()] or [0])
            for t in texts:
              if t not in existing:
                mx+=1; d['notes'].append({'id':f'{prefix}-{mx}','text':t,'subcategory':subcat,'sourcePage':None,'timeSensitive':True})
            d['count']=len(d['notes']); path.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n'); return len(texts)
          for x in ['public/one-liner-gk/current-affairs-archive.json','src/data/bundled/current-affairs-archive.json']: add_notes(root/x,general,'current-affairs-archive','Current Affairs 2026')
          for x in ['public/one-liner-gk/pakistan-current-affairs.json','src/data/bundled/pakistan-current-affairs.json']: add_notes(root/x,pk,'pakistan-current-affairs','Pakistan Current Affairs 2026')
          idxp=root/'public/one-liner-gk/index.json'; idx=json.loads(idxp.read_text()); idx['generatedAt']='2026-09-15'; idx['total']+=8
          for c in idx['categories']:
            if c['slug']=='current-affairs-archive':
              c['count']+=6;c['timeSensitiveCount']+=6
              next(s for s in c['subcategories'] if s['name']=='Current Affairs 2026')['count']+=6
            if c['slug']=='pakistan-current-affairs':
              c['count']+=2;c['timeSensitiveCount']+=2
              next(s for s in c['subcategories'] if s['name']=='Pakistan Current Affairs 2026')['count']+=2
          idxp.write_text(json.dumps(idx,ensure_ascii=False,separators=(',',':'))+'\n')
          mcqs=[
          ('Pakistan and Canada agreed on 15 September 2026 to accelerate negotiations on which agreement?',['Foreign Investment Promotion and Protection Agreement (FIPA)','South Asian Free Trade Area (SAFTA)','Comprehensive Economic Partnership Agreement (CEPA)','Double Taxation Convention'],0,'Pakistan-Canada Investment Relations'),
          ('According to Reuters on 15 September 2026, LNG demand is expected to rebound after the Middle East war ends in which group of countries?',['China, India and Pakistan','Japan, South Korea and Australia','Pakistan, Iran and Türkiye','India, Bangladesh and Sri Lanka'],0,'Global Energy Markets'),
          ('More than 100,000 people were reported displaced by renewed conflict in which country on 15 September 2026?',['Yemen','Sudan','Libya','Syria'],0,'Yemen Conflict'),
          ('The WTO warned on 15 September 2026 that which system was at a critical juncture requiring reform?',['The global trading system','The global postal system','The international aviation system','The global patent-registration system'],0,'WTO and Multilateral Trade'),
          ('Who was the UN human rights chief who raised war-crimes concerns over remains recovered from Gaza rubble in September 2026?',['Volker Türk','António Guterres','Filippo Grandi','Rafael Grossi'],0,'International Human Rights'),
          ('Russia reportedly launched around how many drones overnight during renewed Russia-Ukraine energy strikes reported on 15 September 2026?',['200','20','50','500'],0,'Russia-Ukraine War')]
          mp=root/'public/css-subject-mcqs/current-affairs.json'; arr=json.loads(mp.read_text()); stems={q['question'] for q in arr}
          for q,opts,a,topic in mcqs:
            if q in stems: continue
            hid=hashlib.sha1(q.encode()).hexdigest()[:14]
            arr.append({'subject':'Current Affairs','topic':topic,'question':q,'options':opts,'answer':a,'explanation':None,'id':'css-current-affairs-'+hid,'sourceDocument':'Daily Current Affairs 2026-09-15','source':'CSS Vista verified daily current affairs · 2026-09-15','verification':'cross-checked against cited source in dated Current Affairs edition'})
          mp.write_text(json.dumps(arr,ensure_ascii=False,separators=(',',':'))+'\n')
          ip=root/'public/css-subject-mcqs/index.json'; ix=json.loads(ip.read_text()); ix['generatedAt']='2026-09-15T14:55:00.000Z'; ix['total']+=6
          for s in ix['subjects']:
            if s['slug']=='current-affairs':
              s['count']+=6; s['sourceCount']=s.get('sourceCount',s['count']-6)+6
              if 'Daily Current Affairs 2026-09-15' not in s.get('sourceDocuments',[]): s.setdefault('sourceDocuments',[]).append('Daily Current Affairs 2026-09-15')
          ip.write_text(json.dumps(ix,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          node scripts/package-current-affairs.mjs --check
          php tests/current-affairs-validation.php
          node scripts/audit-integrated-academics.mjs
      - name: Commit publication
        run: |
          rm .github/workflows/publish-current-affairs-2026-09-15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/current-affairs/2026/09/2026-09-15.json public/one-liner-gk/current-affairs-archive.json src/data/bundled/current-affairs-archive.json public/one-liner-gk/pakistan-current-affairs.json src/data/bundled/pakistan-current-affairs.json public/one-liner-gk/index.json public/css-subject-mcqs/current-affairs.json public/css-subject-mcqs/index.json .github/workflows/publish-current-affairs-2026-09-15.yml
          git commit -m 'Publish current affairs 2026-09-15'
          git push origin HEAD:main
